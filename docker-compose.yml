services:
  mysql:
    image: mysql:8.4
    container_name: disclosure-ai-mysql
    environment:
      MYSQL_DATABASE: disclosure_ai
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: disclosure-ai-app
    depends_on:
      mysql:
        condition: service_healthy   # DB가 실제로 응답할 때까지 앱 기동을 기다림
    environment:
      DB_URL: jdbc:mysql://mysql:3306/disclosure_ai?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "8080:8080"

volumes:
  mysql-data:
