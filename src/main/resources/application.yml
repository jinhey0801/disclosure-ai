spring:
  application:
    name: disclosure-ai
  datasource:
    # 로컬(IDE) 실행 기본값. Docker에서는 환경변수로 덮어쓴다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/disclosure_ai?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마 변경은 Flyway 마이그레이션으로만
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
